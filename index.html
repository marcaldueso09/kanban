<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <menu>
            <profile>
                <greeting>
                    <h1>Kanban Board</h1>
                </greeting>
                <project>
                    <h3>AskMe - ISMS Task Board</h3>
                </project>
            </profile>
            <actions>
                <form id="taskForm">
                    <div class="task-form-panel">
                        <input name="title" placeholder="Title" />
                        <textarea name="description"></textarea>
                        <button type="submit">Create</button>
                    </div>
                </form>
                <span class="material-symbols-outlined button addTask" id="addTaskBtn">add</span>
                <span class="material-symbols-outlined button" id="saveBtn">save</span>
            </actions>
        </menu>
        <board>
            <todo>
                <section id="todo-section" >
                    <div class="column-header">TODO</div>
                    <div class="column-cards" data-status="todo"></div>
                </section>
            </todo>
            <inprogress>
                <section id="in-progress-section" >
                    <div class="column-header">IN-PROGRESS</div>
                    <div class="column-cards" data-status="in-progress"></div>
                </section>
            </inprogress>
            <review>
                <section id="review-section" >
                    <div class="column-header">REVIEW</div>
                    <div class="column-cards" data-status="review"></div>
                </section>
            </review>
            <done>
                <section id="done-section" >
                    <div class="column-header">DONE</div>
                    <div class="column-cards" data-status="done"></div>
                </section>
            </done>
        </board>
        <template id="task-card-template">
            <div class="task-card draggable" draggable="true">
                <span class="material-symbols-outlined button more">more_horiz</span>
                <div class="task-options-menu hidden">
                    <button class="edit-opt-btn">Edit</button>
                    <button class="delete-opt-btn">Delete</button>
                    <button class="move-opt-btn mobile-only">Move to...</button>
                    <div class="move-choices-container hidden"></div>
                </div>
                <h3 class="task-title"></h3>
                <p class="task-desc"></p>
            </div>
        </template>
        <script src="dist/app.js" type="module"></script>
    </body>
</html>
